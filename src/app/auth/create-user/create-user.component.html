<div class="login-container">
    <div class="background"></div>
    <div class="overlay"></div>
    <div class="card-px">
        <div class="icon-wrapper">
            <i class="pi pi-user-plus"></i>
        </div>
        <div class="p-fluid">
            <div class="p-field">
                <label for="nombres">Nombres</label>
                <input id="nombres" type="text" pInputText
                    [(ngModel)]="paciente.nombres"
                    placeholder="Ingrese sus nombres">
            </div>
            <div class="p-field">
                <label for="apellidos">Apellidos</label>
                <input id="apellidos" type="text" pInputText
                    [(ngModel)]="paciente.apellidos"
                    placeholder="Ingrese sus apellidos">
            </div>
            <div class="p-field">
                <label for="fechaNacimiento">Fecha de Nacimiento</label>
                <input id="fechaNacimiento" type="date" pInputText
                    [(ngModel)]="paciente.fecha_nacimiento">
            </div>
            <div class="p-field">
                <label for="direccion">Dirección</label>
                <input id="direccion" type="text" pInputText
                    [(ngModel)]="paciente.direccion"
                    placeholder="Ingrese su dirección">
            </div>
            
            <div class="p-field">
                <label for="telefono">Teléfono</label>
                <input id="telefono" type="text" pInputText
                    [(ngModel)]="paciente.telefono"
                    placeholder="Ingrese su teléfono">
            </div>
            <!-- Pendiente de crear y aggregar model -->
            <div class="p-field">
                <label for="tempPass">Contraseña Temporal</label>
                <div class="password-wrapper">
                    <input id="tempPass" type="{{ showPassword ? 'text' : 'password' }}" pInputText placeholder="Ingrese su Contraseña temporal">
                    <span class="eye-icon" (click)="togglePasswordVisibility()">
                        <i [ngClass]="showPassword ? 'pi pi-eye' : 'pi pi-eye-slash'"></i>
                    </span>
                </div>
            </div>
            <!-- Pendiente de crear y aggregar model -->
            <div class="p-field">
                <label for="newpass">Contraseña Nueva</label>
                <div class="password-wrapper">
                    <input id="newPass" type="{{ showPassword ? 'text' : 'password' }}" pInputText placeholder="Ingrese su Contraseña Nueva">
                    <span class="eye-icon" (click)="togglePasswordVisibility()">
                        <i [ngClass]="showPassword ? 'pi pi-eye' : 'pi pi-eye-slash'"></i>
                    </span>
                </div>
            </div>
            <!-- Pendiente de crear y aggregar model -->
            <div class="p-field">
                <label for="newpassval">Valida tu nueva contraseña</label>
                <div class="password-wrapper">
                    <input id="newPassval" type="{{ showPassword ? 'text' : 'password' }}" pInputText placeholder="Ingrese de nuevo su contraseña">
                    <span class="eye-icon" (click)="togglePasswordVisibility()">
                        <i [ngClass]="showPassword ? 'pi pi-eye' : 'pi pi-eye-slash'"></i>
                    </span>
                </div>
            </div>
            <div class="p-field">
                <label for="correoElectronico">Correo Electrónico</label>
                <input id="correoElectronico" type="email" pInputText
                    [(ngModel)]="paciente.correo_electronico" disabled="true"
                    placeholder="Ingrese su correo electrónico">
            </div>
            <div class="p-field">
                <label for="codigoPaciente">Código de Paciente</label>
                <input id="codigoPaciente" type="text" pInputText
                    [(ngModel)]="paciente.codigo_paciente" disabled="true"
                    placeholder="Ingrese su código de paciente">
            </div>
            <div class="p-field" style="margin-top: 10px;">
                <button pButton type="button"
                    label="Guardar Datos del Paciente"
                    icon="pi pi-save" (click)="guardarPaciente()"
                    class="login-button"></button>
            </div>
        </div>
    </div>
</div>
